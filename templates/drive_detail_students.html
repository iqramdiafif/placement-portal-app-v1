<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>placement drive details</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4">
        <h2>{{ drive.job_title }}</h2>
    </div>
    <div id="main">
        <div id="canvas">
            <h3>Details</h3>
                <p>Drive ID: {{drive.drive_id}}</p>
                <p>Job Title: {{drive.job_title}}</p>
                <p>Description: {{drive.description}}</p>
                <p>Eligibility: {{drive.eligibility}}</p>
                <p>Company ID: {{drive.company_id}}</p>
                <p>Status: {{drive.status}}</p>

            <button onclick="history.back()" class="btn btn-dark">Back</button>
        </div>
    </div>
</body>
</html>
