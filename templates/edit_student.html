<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>student dashboard edit</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="box">
                <h2>Edit</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Student name</label>
                        <input type="text" class="form-control" name="student_name" value="{{student.student_name}}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="text" class="form-control" name="cgpa" value="{{student.cgpa}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Resume(Paste link)</label>
                        <input type="text" class="form-control" name="resume" value="{{student.resume}}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success">Update</button>
                        <button onclick="history.back()" class="btn btn-dark">Back</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
