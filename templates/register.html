<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register: Placement Portal</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="box">
                <h2>Register</h2>
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Username</label>
                        <input type="text" class="form-control" id="Input1" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label">Email</label>
                        <input type="email" class="form-control" id="Input3" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Input2" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Register as:</label>
                        <select class="form-select" name="role">
                            <option value="" disabled selected>Select</option>
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="Input5" class="form-label">Student Name</label>
                        <input type="text" class="form-control" name="student_name"
                    </div>
                    <div class="mb-3">
                        <label for="Input6" class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="company_name"
                    </div>
                    <div class="mb-3">
                        <label for="Input7" class="form-label">HR Contact</label>
                        <input type="text" class="form-control" name="hr_contact"
                    </div>
                    <div class="mb-3">
                        <label for="Input8" class="form-label">Website</label>
                        <input type="text" class="form-control" name="website"
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-primary" value="Register"><br>
                        Already have a account? <a href="{{ url_for('login')}}">Login here.</a> 
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
