<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login: Placement Portal</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
</head>

<body>
    <div id="main">
        <div id="canvas">
            <div id="box">
                <h2>Login</h2>
                <form method="post" action="/">
                    <div class="mb-3">
                        <label for="Input1" class="form-label">Username</label>
                        <input type="text" class="form-control" id="Input1" name="username">
                    </div>
                    <div class="mb-3">
                        <label for="Input2" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Input2" name="password">
                    </div>
                    <div class="text-center">
                        <input type="submit" class="btn btn-primary" value="Login"><br>
                        New User? <a href="{{ url_for('register')}}">Register here.</a> 
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
